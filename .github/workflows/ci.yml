name: Fixture dbt CI
on:
  push:
  pull_request:
jobs:
  dbt-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Create isolated deterministic fixture
        run: python scripts/create_ci_fixture.py
      - name: Check CI target
        run: dbt debug --profiles-dir . --target ci
      - name: Build models and test fixture invariants
        run: dbt build --profiles-dir . --target ci --exclude tag:production_snapshot
