version: 2

models:
  - name: stg_reference__countries
    description: >
      Complete EU-27 mapping between NOAA country codes, ISO alpha-2
      codes, and country names.
    columns:
      - name: noaa_country_code
        data_tests:
          - not_null
          - unique

      - name: iso_alpha2
        data_tests:
          - not_null
          - unique

      - name: country_name
        data_tests:
          - not_null
          - unique

      - name: source_file
        data_tests:
          - not_null

      - name: ingested_at_utc
        data_tests:
          - not_null

  - name: stg_reference__analysis_parameters
    description: >
      Long-form representation of the frozen ClimatePulse methodology
      parameters. Values remain strings until typed downstream.
    columns:
      - name: parameter_name
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values:
                  - baseline_start_date
                  - baseline_end_date
                  - recent_start_date
                  - recent_end_date
                  - overall_completeness_threshold
                  - monthly_completeness_threshold

      - name: parameter_value
        data_tests:
          - not_null

      - name: description
        data_tests:
          - not_null

      - name: source_file
        data_tests:
          - not_null

      - name: ingested_at_utc
        data_tests:
          - not_null